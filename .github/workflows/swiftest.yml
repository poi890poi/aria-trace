name: SwifTest
on:
  push:
    paths: ['swiftest/**', 'examples/**', 'tests/test_swiftest*.py', 'tests/test_genshin*.py', 'pyproject.toml', '.github/workflows/swiftest.yml']
  pull_request:
    paths: ['swiftest/**', 'examples/**', 'tests/test_swiftest*.py', 'tests/test_genshin*.py', 'pyproject.toml', '.github/workflows/swiftest.yml']
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -I -m swiftest --help
      - run: swiftest --help
      - run: python -m unittest discover -s tests -p "test_swiftest*.py"
      - run: python -m unittest discover -s tests -p "test_genshin*.py"
